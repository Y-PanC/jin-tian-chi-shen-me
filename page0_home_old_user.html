<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4FA">
  <link rel="icon" href="data:,">
  <meta name="description" content="今天吃什么：问一问下一顿，随手记下这一顿。">
  <title>今天吃什么</title>
  <script>
    (() => {
      try {
        const profile = JSON.parse(localStorage.getItem('user_profile') || 'null');
        if (!profile || typeof profile !== 'object' || Array.isArray(profile)) location.replace('page1_guide.html');
      } catch { location.replace('page1_guide.html'); }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --purple: #7976AF;
      --yellow: #FFD361;
      --brown: #B4816E;
      --pink: #E39BBD;
      --bg-outer: #E4E1EE;
      --bg-page: #F6F4FA;
      --ink: #39314A;
      --ink-sub: #948DA8;
      --ink-mute: #9C96B5;
      --nav-off: #A79FB9;
      --nav-off-ic: #BDB7CD;
      --white: #FFFFFF;
      --nav-line: #E7E3F0;
      --avatar-bg: #E9E6F4;
      --hero-sub: #CDC9E2;
      --log-title: #FAF3EE;
      --log-sub: #E3CDBF;
      --button-ink: #4A3A05;
    }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-outer);
      color: var(--ink);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .phone {
      width: 390px;
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
    }
    .phone { padding-top: env(safe-area-inset-top, 0px); }
    .page { flex: 1; min-height: 0; padding: 16px 20px 22px; overflow-y: auto; scrollbar-width: none; }
    .page::-webkit-scrollbar { display: none; }
    svg { display: block; fill: none; stroke: var(--purple); flex-shrink: 0; }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--purple); outline-offset: 4px; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 18px; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .brand span { color: var(--purple); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--avatar-bg); display: flex; align-items: center; justify-content: center; }
    .avatar svg { width: 19px; height: 19px; }
    .hero { background: var(--purple); border-radius: 20px; padding: 22px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .hero .left { min-width: 0; }
    .hero h1 { font-size: 24px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; color: var(--bg-page); }
    .hero h1 span { color: var(--yellow); }
    .hero p { font-size: 12px; font-weight: 400; color: var(--hero-sub); line-height: 1.4; margin-bottom: 14px; }
    .hero .btn { display: inline-block; background: var(--yellow); color: var(--button-ink); font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 20px; }
    .hero .art { flex-shrink: 0; }
    .hero .art svg { width: 88px; height: 88px; stroke: var(--yellow); }
    .log { background: var(--brown); border-radius: 20px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .log .t { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--log-title); }
    .log .s { font-size: 12px; font-weight: 400; color: var(--log-sub); line-height: 1.4; }
    .log .right { display: flex; align-items: center; gap: 10px; margin-left: 10px; }
    .log .right svg { width: 34px; height: 34px; stroke: var(--yellow); }
    .log .arrow { font-size: 16px; color: var(--yellow); }
    .sec-t { font-size: 15px; font-weight: 600; margin: 0 2px 10px; display: flex; justify-content: space-between; align-items: center; }
    .sec-t .more { font-size: 12px; font-weight: 400; color: var(--ink-mute); }
    .knows { display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 4px; scrollbar-color: var(--nav-off-ic) var(--white); scrollbar-width: thin; }
    .knows::-webkit-scrollbar { height: 10px; }
    .knows::-webkit-scrollbar-track { background: var(--white); border-radius: 14px; }
    .knows::-webkit-scrollbar-thumb { background: var(--nav-off-ic); border-radius: 14px; }
    .know { flex: 0 0 118px; min-width: 118px; background: var(--white); border-radius: 14px; padding: 12px; }
    .know:last-child { flex-basis: auto; width: 138px; }
    .know .ic { display: block; margin-bottom: 10px; }
    .know .ic svg { width: 22px; height: 22px; stroke: var(--pink); }
    .know .t { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
    .know .s { font-size: 11px; font-weight: 400; color: var(--ink-sub); line-height: 1.55; }
    .know .from { font-size: 10px; font-weight: 400; line-height: 1.3; color: var(--brown); margin-top: 8px; }
    .nav { flex-shrink: 0; margin: 0 20px 16px; margin-bottom: max(16px, env(safe-area-inset-bottom)); background: var(--white); border: 1px solid var(--nav-line); border-radius: 26px; display: flex; padding: 12px 0 11px; }
    .nav .tab { flex: 1; text-align: center; font-size: 11px; font-weight: 400; color: var(--nav-off); }
    .nav .tab .ic { display: flex; align-items: center; justify-content: center; width: 38px; height: 26px; margin: 0 auto 4px; border-radius: 13px; }
    .nav .tab .ic svg { width: 22px; height: 22px; stroke: var(--nav-off-ic); }
    .nav .tab.on { color: var(--ink); font-weight: 600; }
    .nav .tab.on .ic { background: var(--yellow); }
    .nav .tab.on .ic svg { stroke: var(--purple); }
  </style>
  <script src="assets/preferences.js" defer></script>
  <script type="module" src="assets/home.js"></script>
</head>
<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 10 9-7 9 7M5.5 8v12h5v-6h3v6h5V8"/>
    </symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m13.5 2-9 12h6l-1 8 10-13h-6l1-7Z"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m8 6 1.2-3h5.6L16 6"/><rect x="2.5" y="6" width="19" height="14" rx="3"/><circle cx="12" cy="13" r="4"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>
    </symbol>
    <symbol id="i-noodle" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11h18a9 9 0 0 1-18 0ZM6.5 7.5c1.5-1.9 2-1.9 3.5 0s2 1.9 3.5 0 2-1.9 3.5 0"/>
    </symbol>
    <symbol id="i-rice" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11h18a9 9 0 0 1-18 0ZM5 11V9a3 3 0 0 1 4-2.8A3.5 3.5 0 0 1 15.5 6 3 3 0 0 1 19 9v2M9 4.5V3M13 4V2.5"/>
    </symbol>
    <symbol id="i-chili" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 5c0-2 1-3 3-3M8 5c8-1 12 8 8 13-2 3-7 3-9 .5-1-1.3-1.5-2.8-1-4.5M8 5l3 1"/>
    </symbol>
    <symbol id="i-veg" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 20c-1-8 1-13 9-16 1 8-2 12-9 16ZM7 20l7-11"/>
    </symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="15" rx="3"/><path d="M18 6V3.5L6 6M21 11h-4a2.5 2.5 0 0 0 0 5h4"/><circle cx="17" cy="13.5" r=".5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>
    </symbol>
  </svg>

  <div class="phone">
    <main class="page">

      <header class="top">
        <div class="brand">今天<span>吃什么</span></div>
        <a class="avatar" href="page5_profile.html" aria-label="查看我的档案">
          <svg aria-hidden="true"><use href="#i-user"/></svg>
        </a>
      </header>

      <a class="hero" href="page2_ask.html" aria-labelledby="hero-title">
        <div class="left">
          <h1 id="hero-title">现在<br>决定<span>吃什么</span></h1>
          <p id="goal-description">当前目标：营养均衡，已结合你的档案</p>
          <span class="btn">问一问 →</span>
        </div>
        <div class="art" aria-hidden="true"><svg><use href="#i-noodle"/></svg></div>
      </a>

      <a class="log" href="page4_log.html" aria-label="记一顿，拍照、语音或文字记录">
        <div class="left">
          <div class="t">记一顿</div>
          <div class="s">拍照 / 语音 / 文字，随手记录</div>
        </div>
        <span class="right" aria-hidden="true">
          <svg><use href="#i-camera"/></svg><span class="arrow">→</span>
        </span>
      </a>

      <section aria-labelledby="knowledge-title">
        <div class="sec-t">
          <h2 id="knowledge-title" style="font:inherit">饮食搭配小知识</h2>
          <button class="more" type="button" aria-controls="knowledge-cards" aria-label="查看更多饮食搭配小知识">更多 →</button>
        </div>
        <div class="knows" id="knowledge-cards" tabindex="0" role="region" aria-label="饮食搭配小知识，可左右滑动">
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-veg"/></svg></span>
            <h3 class="t">口味自己定</h3>
            <p class="s">点单时备注少油或酱汁另放，按自己的习惯选择。</p>
            <p class="from">通用小知识</p>
          </article>
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-noodle"/></svg></span>
            <h3 class="t">吃过什么，记一笔</h3>
            <p class="s">留下菜名和口味，下次决定时多一点参考。</p>
            <p class="from">通用小知识</p>
          </article>
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-chili"/></svg></span>
            <h3 class="t">辣度备注说清楚</h3>
            <p class="s">用微辣、中辣等明确备注，点单前和商家确认。</p>
            <p class="from">通用小知识</p>
          </article>
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-rice"/></svg></span>
            <h3 class="t">预算留点余地</h3>
            <p class="s">除了餐费，点单时也看看配送费和打包费。</p>
            <p class="from">通用小知识</p>
          </article>
        </div>
      </section>
    </main>

    <nav class="nav" aria-label="主导航">
      <a class="tab on" href="page0_home_old_user.html" aria-current="page">
        <span class="ic" aria-hidden="true"><svg><use href="#i-home"/></svg></span>首页
      </a>
      <a class="tab" href="page2_ask.html">
        <span class="ic" aria-hidden="true"><svg><use href="#i-bolt"/></svg></span>问一问
      </a>
      <a class="tab" href="page4_log.html">
        <span class="ic" aria-hidden="true"><svg><use href="#i-camera"/></svg></span>记一顿
      </a>
      <a class="tab" href="page5_profile.html">
        <span class="ic" aria-hidden="true"><svg><use href="#i-user"/></svg></span>我的
      </a>
    </nav>
  </div>


</body>
</html>
