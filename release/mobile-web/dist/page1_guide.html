<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4FA">
  <meta name="description" content="用六个小问题，记住你的饮食偏好。每一步都可以跳过。">

  <title>个人档案 · 今天吃什么</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --purple: #7976AF; --yellow: #FFD361; --brown: #B4816E; --pink: #E39BBD;
      --bg-outer: #E4E1EE; --bg-page: #F6F4FA; --ink: #39314A; --ink-sub: #948DA8;
      --ink-mute: #9C96B5; --nav-off: #A79FB9; --nav-off-ic: #BDB7CD;
      --white: #FFFFFF; --nav-line: #E7E3F0; --avatar-bg: #E9E6F4;
      --hero-sub: #CDC9E2; --log-title: #FAF3EE; --log-sub: #E3CDBF; --button-ink: #4A3A05;
    }
    [hidden] { display: none !important; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-outer); color: var(--ink); display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh; }
    .phone { width: 390px; max-width: 100%; height: 100vh; height: 100dvh; background: var(--bg-page); display: flex; flex-direction: column; }
    .phone { padding-top: env(safe-area-inset-top, 0px); }
    .page { flex: 1; min-height: 0; padding: 16px 20px 22px; overflow-y: auto; scrollbar-width: none; }
    .page::-webkit-scrollbar { display: none; }
    svg { display: block; fill: none; stroke: var(--purple); flex-shrink: 0; }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    button, input { font: inherit; }
    button { border: 0; background: none; color: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--purple); outline-offset: 4px; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 18px; min-height: 58px; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .brand span { color: var(--purple); }
    .top.editing-preferences { justify-content: flex-start; gap: 12px; }
    .guide-return { display: flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--white); }
    .guide-return svg { width: 20px; height: 20px; }
    .progress { display: flex; gap: 10px; margin-top: -10px; margin-bottom: 8px; list-style: none; }
    .progress li { flex: 1; min-width: 0; font-size: 10px; color: var(--ink-mute); }
    .progress button { display: block; width: 100%; min-height: 44px; padding: 10px 0; border-radius: 4px; font: inherit; color: inherit; text-align: left; white-space: nowrap; }
    .progress button::before { content: ""; display: block; height: 4px; border-radius: 20px; background: var(--nav-line); margin-bottom: 6px; }
    .progress li.current { color: var(--purple); font-weight: 600; }
    .progress li.current button::before { background: var(--yellow); }
    .progress li.done button::before { background: var(--purple); }
    .hero { background: var(--purple); border-radius: 20px; padding: 22px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .hero .left { min-width: 0; }
    .hero .eyebrow { font-size: 11px; color: var(--hero-sub); margin-bottom: 10px; }
    .hero h1 { font-size: 24px; font-weight: 800; line-height: 1.3; color: var(--bg-page); white-space: pre-line; outline: none; }
    .hero h1 span { color: var(--yellow); }
    .hero .art svg { width: 88px; height: 88px; stroke: var(--yellow); }
    fieldset { min-width: 0; border: 0; }
    legend { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
    .hint { font-size: 12px; color: var(--ink-sub); line-height: 1.55; margin-bottom: 18px; }
    .choices { display: flex; flex-wrap: wrap; gap: 10px; }
    .choice { position: relative; display: block; cursor: pointer; }
    .choice input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .choice-body { display: flex; align-items: center; justify-content: center; padding: 8px 14px; min-height: 38px; border-radius: 16px; background: var(--white); color: var(--ink); font-size: 12px; line-height: 1.4; }
    .choice input:checked + .choice-body { background: var(--purple); color: var(--white); }
    .choice input:focus-visible + .choice-body { outline: 2px solid var(--purple); outline-offset: 4px; }
    .field { margin-top: 22px; }
    .field label { display: block; margin-bottom: 10px; font-size: 12px; font-weight: 600; }
    .text-input { width: 100%; min-width: 0; border: 1px solid var(--nav-line); border-radius: 14px; padding: 12px 14px; background: var(--white); color: var(--ink); font-size: 13px; line-height: 1.4; }
    .text-input::placeholder { color: var(--ink-mute); }
    .selection-note { font-size: 11px; color: var(--ink-sub); line-height: 1.55; margin-top: 14px; }
    .goal-choices { display: flex; flex-direction: column; gap: 10px; }
    .goal-choices .choice-body { justify-content: space-between; padding: 12px 14px; border-radius: 14px; }
    .goal-title { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .goal-desc { display: block; font-size: 11px; color: var(--ink-sub); line-height: 1.55; }
    .goal-choices input:checked + .choice-body .goal-desc { color: var(--hero-sub); }
    .choice-dot { flex-shrink: 0; width: 16px; height: 16px; border: 1px solid var(--nav-off-ic); border-radius: 50%; margin-left: 14px; }
    .choice input:checked + .choice-body .choice-dot { border: 4px solid var(--yellow); background: var(--purple); }
    .budget-field { display: flex; align-items: center; gap: 10px; }
    .budget-field .unit { flex-shrink: 0; font-size: 13px; color: var(--ink-sub); }
    .summary { background: var(--white); border-radius: 14px; padding: 12px; margin-top: 22px; }
    .summary .title { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .summary .detail { font-size: 11px; color: var(--ink-sub); line-height: 1.55; overflow-wrap: anywhere; }
    .error { border-radius: 14px; background: var(--white); padding: 12px; margin-top: 14px; font-size: 12px; color: var(--brown); line-height: 1.55; }
    .skip-step { display: block; flex-shrink: 0; padding: 10px 20px; margin: 6px 20px 0; border: 1px solid var(--nav-line); border-radius: 20px; background: var(--white); font-size: 13px; font-weight: 700; line-height: 1.4; color: var(--ink); }
    .privacy { text-align: center; font-size: 10px; color: var(--ink-mute); line-height: 1.55; margin-top: 6px; }
    .actions { flex-shrink: 0; display: flex; gap: 10px; padding: 10px 20px 14px; }
    .btn { font-size: 13px; font-weight: 700; line-height: 1.4; padding: 10px 20px; border-radius: 20px; }
    .btn-back { background: var(--white); border: 1px solid var(--nav-line); color: var(--ink); }
    .btn-next { flex: 1; background: var(--yellow); color: var(--button-ink); }
    .nav { flex-shrink: 0; margin: 0 20px 16px; margin-bottom: max(16px, env(safe-area-inset-bottom)); background: var(--white); border: 1px solid var(--nav-line); border-radius: 26px; display: flex; padding: 12px 0 11px; }
    .nav .tab { flex: 1; text-align: center; font-size: 11px; font-weight: 400; color: var(--nav-off); }
    .nav .tab .ic { display: flex; align-items: center; justify-content: center; width: 38px; height: 26px; margin: 0 auto 4px; border-radius: 13px; }
    .nav .tab .ic svg { width: 22px; height: 22px; stroke: var(--nav-off-ic); }
    .nav .tab.on { color: var(--ink); font-weight: 600; }
    .nav .tab.on .ic { background: var(--yellow); }
    .nav .tab.on .ic svg { stroke: var(--purple); }
  
    legend { line-height: 1.55; overflow-wrap: anywhere; }
    .progress li { white-space: nowrap; }
    .confirmation { background: var(--white); border-radius: 14px; padding: 18px 20px; }
    .confirmation h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; outline: none; }
    .confirmation dl > div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; }
    .confirmation dt { font-size: 12px; color: var(--ink-sub); }
    .confirmation dd { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; text-align: right; }
    .confirmation p { font-size: 11px; color: var(--ink-sub); line-height: 1.55; margin-top: 10px; }
    .profile-dialog { width: calc(100% - 40px); max-width: 350px; margin: auto; padding: 22px 20px; border: 0; border-radius: 20px; background: var(--white); color: var(--ink); }
    .profile-dialog::backdrop { background: var(--bg-outer); }
    .profile-dialog h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .profile-dialog p { font-size: 13px; color: var(--ink-sub); line-height: 1.55; margin-bottom: 22px; }
    .profile-dialog .btn { width: 100%; }
  </style>

  <div class="phone">
    <main class="page">
      <header class="top"><a id="guide-return" class="guide-return" href="page6_settings.html" aria-label="返回设置" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></a><div class="brand">今天<span>吃什么</span></div></header>
      <ol class="progress" id="progress" aria-label="引导进度"></ol>
      <header class="hero">
        <div class="left"><p class="eyebrow" id="step-caption">个人档案 · 1 / 6</p><h1 id="step-title" tabindex="-1">吃好每一顿，<br><span>从小目标开始。</span></h1></div>
        <div class="art" aria-hidden="true"><svg><use id="step-art" href="#i-pen"/></svg></div>

      <form id="preference-form" novalidate>
        <fieldset>
          <legend id="question">最近吃饭主要顾及哪一方面？</legend>
          <div class="choices" id="choices"></div>
          <div class="field" id="other-field" hidden>
            <input class="text-input" id="restriction-other" aria-label="其他忌口或过敏" type="text" maxlength="80" autocomplete="off" placeholder="例如：香菜、鸡蛋，用顿号分隔">
          </div>
        </fieldset>
        <noscript><p class="hint">请开启 JavaScript 以填写并保存偏好</p></noscript>
      </form>
      <p class="error" id="form-error" role="alert" hidden></p>
      <section class="confirmation" id="confirmation" aria-labelledby="confirmation-title" hidden>
        <h2 id="confirmation-title" tabindex="-1">这顿偏好已记下</h2>
        <dl id="confirmation-details"></dl>
        <p>想法变了也没关系，随时返回修改</p>
      </section>
    </main>
    <button class="skip-step" id="skip-step" type="button">跳过</button>
    <div class="actions">
      <button class="btn btn-back" id="back" type="button" hidden>上一步</button>
      <button class="btn btn-next" id="next" type="submit" form="preference-form">下一步 →</button>
      <button class="btn btn-next" id="done" type="button" hidden>返回首页 →</button>
    </div>
