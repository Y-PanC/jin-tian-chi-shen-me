<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
  <title>重新开始 · 今天吃什么</title>
</head>
<body>
  <div class="phone">
    <main class="page">
      <div class="top"><div class="brand">今天<span>吃什么</span></div></div>
      <section class="card stack">
        <h1>重新开始新手引导</h1>
        <p class="hint">重置饮食偏好和本次选择，从第一步开始。饮食记录和个人信息会保留。</p>
        <button id="restart" class="btn btn-primary" type="button">从新手引导开始</button>
        <button id="restore" class="btn btn-secondary" type="button" hidden>恢复上一次偏好</button>
        <a class="btn btn-secondary" href="index.html">返回应用</a>
        <p id="message" class="hint" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    const backupKey = 'onboarding_restart_backup';
    const temporaryKeys = ['meal_request', 'last_recommendation', 'selected_meal'];
    const message = document.getElementById('message');
    try { document.getElementById('restore').hidden = !localStorage.getItem(backupKey); } catch {}
    document.getElementById('restart').addEventListener('click', () => {
      try {
        const backup = {
          profile: localStorage.getItem('user_profile'),
          session: Object.fromEntries(temporaryKeys.map(key => [key, sessionStorage.getItem(key)])),
          savedAt: new Date().toISOString()
        };
        localStorage.setItem(backupKey, JSON.stringify(backup));
        localStorage.removeItem('user_profile');
        temporaryKeys.forEach(key => sessionStorage.removeItem(key));
        location.replace('page1_guide.html');
      } catch {
        message.textContent = '未能重置，请检查浏览器的网站存储设置。';
        document.getElementById('restore').hidden = false;
      }
    });
    document.getElementById('restore').addEventListener('click', () => {
      try {
        const backup = JSON.parse(localStorage.getItem(backupKey));
        if (!backup || !Object.hasOwn(backup, 'profile')) throw new Error();
        if (backup.profile === null) localStorage.removeItem('user_profile');
        else localStorage.setItem('user_profile', backup.profile);
        temporaryKeys.forEach(key => {
          if (backup.session?.[key] == null) sessionStorage.removeItem(key);
          else sessionStorage.setItem(key, backup.session[key]);
        });
        location.replace('index.html');
      } catch { message.textContent = '未能恢复上一次偏好。'; }
    });
  </script>
</body>
</html>
