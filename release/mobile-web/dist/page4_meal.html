<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F4FA"><link rel="icon" href="data:,"><title>餐食详情｜今天吃什么</title><link rel="stylesheet" href="assets/journal.css?v=4.0.0"><link rel="stylesheet" href="assets/meal-pages.css?v=4.0.0"><link rel="stylesheet" href="assets/account.css?v=4.0.0"><script>if(location.protocol==='file:')location.replace('http://127.0.0.1:5173/'+location.pathname.split('/').pop()+location.search+location.hash)</script></head><body><div class="phone"><svg style="display:none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9M9 21v-7h6v7"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 9-12h-6l1-8Z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4l2-3h5l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21c.7-4.2 3.4-6.5 8-6.5s7.3 2.3 8 6.5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></symbol><symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></svg>
<main class="page meal-detail-page" id="pageScroll">
  <header class="meal-detail-head"><a id="backToMeals" class="meal-back" href="page4_log.html" aria-label="返回最近饮食"><svg aria-hidden="true"><use href="#i-back"/></svg></a><h1 id="detailTitle">记一顿</h1><span id="detailCaption">新的餐食</span></header>
  <p id="detailIntro" class="detail-intro">记下吃过的，也记下喜欢的</p>
  <p id="missingRecord" class="form-error" role="alert" hidden>这条记录已不存在，请返回最近饮食</p>
  <form id="mealForm" class="meal-detail-form" novalidate>
    <section class="detail-block" aria-labelledby="nameLabel"><label id="nameLabel" class="field-heading" for="mealName">这顿吃了什么？</label><input id="mealName" class="meal-input" type="text" maxlength="240" autocomplete="off" placeholder="例如：番茄炒蛋、米饭" required><p class="field-note">多道菜可以用顿号分隔</p></section>
    <section class="detail-block" aria-labelledby="photoTitle"><div class="section-row"><h2 id="photoTitle" class="field-heading">餐食照片</h2><span id="photoCount" class="small-note">0 / 4</span></div><div id="photoGrid" class="meal-photo-grid"></div><button id="addPhotos" type="button" class="photo-add"><svg aria-hidden="true"><use href="#i-camera"/></svg><span>添加照片</span></button><input id="photoInput" type="file" accept="image/*" multiple hidden><p id="photoHint" class="field-note">最多 4 张，上传后自动填写菜名和标签</p><p id="referencePhotoCredit" class="field-note reference-photo-credit" hidden></p><div class="photo-feedback"><p id="photoStatus" class="field-note" role="status" aria-live="polite"></p><button id="retryRecognition" type="button" class="recognition-retry" hidden>重试</button></div></section>
    <section class="detail-block" aria-labelledby="tagsTitle"><div class="section-row"><h2 id="tagsTitle" class="field-heading">这顿的标签</h2><span class="small-note">可多选</span></div><div id="mealTags" class="meal-tag-choices"></div><div class="custom-tag-row"><input id="customTag" class="meal-input" type="text" maxlength="16" placeholder="也可以添加自己的标签" aria-label="自定义标签"><button id="addTag" type="button">添加</button></div></section>
    <section class="detail-block" aria-labelledby="timeLabel"><label id="timeLabel" class="field-heading" for="mealTime">用餐时间</label><div class="meal-time-input"><svg aria-hidden="true"><use href="#i-clock"/></svg><input id="mealTime" class="meal-input" type="datetime-local" step="60" min="1900-01-01T00:00" required></div></section>
    <section class="detail-block" aria-labelledby="remarksLabel"><label id="remarksLabel" class="field-heading" for="mealRemarks">备注</label><div class="meal-remarks-input"><textarea id="mealRemarks" class="meal-input" maxlength="1200" rows="3" placeholder="味道怎么样？有什么想记住的？"></textarea><button id="voiceInput" class="icon-button" type="button" aria-label="语音输入备注" aria-describedby="voiceStatus"><svg aria-hidden="true"><use href="#i-mic"/></svg></button></div><p id="voiceStatus" class="field-note" role="status" aria-live="polite"></p></section>
    <p id="formError" class="form-error" role="alert" hidden></p>
  </form>
</main>
<footer class="meal-savebar"><button id="saveMealButton" class="btn btn-primary" type="submit" form="mealForm">保存这一顿</button></footer>
</div>
<dialog id="discardDialog" class="meal-dialog"><h2>修改还没有保存</h2><p>要先离开这顿记录吗？</p><div><button id="keepEditing" class="btn btn-primary" type="button">继续编辑</button><button id="discardChanges" class="btn btn-secondary" type="button">离开</button></div></dialog>
<script type="module" src="assets/bootstrap.js?v=4.0.0" data-page-module="./meal-editor.js?v=4.0.0"></script></body></html>
