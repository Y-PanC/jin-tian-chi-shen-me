  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4l2-3h5l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></symbol>

</svg>
<main class="page" id="pageScroll">
  <header class="settings-page-head"><a class="back-link" href="page5_profile.html" aria-label="返回我的">‹</a><h1>基本设置</h1></header>
  <p id="accountName" class="account-name"></p><p class="settings-page-copy">管理个人信息和记录输入偏好</p>
  <section class="card">
    <h2 class="section-title">个人信息</h2>
    <div class="settings-field"><label class="settings-label" for="nicknameInput">昵称</label><input id="nicknameInput" class="settings-input" maxlength="24" placeholder="选填"></div><div class="settings-field"><label class="settings-label" for="userIdInput">ID</label><input id="userIdInput" class="settings-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" placeholder="选填，用于个人信息展示"></div>
  </section>
  <section class="card">
    <div class="section-row"><h2 class="section-title">饮食偏好</h2><a class="btn-text" href="page1_guide.html?return=settings">修改偏好 ›</a></div><p class="settings-note">调整长期目标、口味、忌口、辣度、预算和饭量</p>
  </section>
  <section class="card">
    <h2 class="section-title">输入方式</h2>
    <label class="permission-row"><span><strong>照片选择</strong><small>在餐食详情中添加照片，照片随饮食记录保存到当前账号</small></span><input id="photoPermissionToggle" type="checkbox"></label>
    <label class="permission-row"><span><strong>语音输入提示</strong><small>点击麦克风图标后，可使用设备键盘／系统听写；网页不申请麦克风权限</small></span><input id="voicePermissionToggle" type="checkbox"></label>
    <p class="settings-note">系统相机或麦克风权限（如设备需要）由浏览器／操作系统在你主动使用时处理，本页面不会静默开启</p>
  </section>
  <section class="card"><h2 class="section-title">本机记录</h2><p id="localRecordCount" class="settings-note"></p><label id="legacySampleOption" class="legacy-sample-option" hidden><input id="includeLegacySamples" type="checkbox"><span id="legacySampleLabel">同时导入旧版示例记录</span></label><button id="importLocal" class="btn btn-secondary" type="button">导入本机记录</button><p id="importStatus" class="import-status" role="status" aria-live="polite"></p></section>
  <div class="inline-actions"><button id="saveSettings" class="btn btn-primary" type="button">保存设置</button></div><div class="logout-area"><button id="logoutButton" class="btn btn-danger full" type="button">退出登录</button><p class="settings-note">退出后，饮食记录和偏好仍保存在账号中</p></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</main>
