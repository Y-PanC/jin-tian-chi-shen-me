<html lang="zh-CN">
<head>

  <title>今天吃什么</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --purple: #7976AF;
      --yellow: #FFD361;
      --brown: #B4816E;
      --pink: #E39BBD;
      --bg-outer: #E4E1EE;
      --bg-page: #F6F4FA;
      --ink: #39314A;
      --ink-sub: #948DA8;
      --ink-mute: #9C96B5;
      --nav-off: #A79FB9;
      --nav-off-ic: #BDB7CD;
      --white: #FFFFFF;
      --nav-line: #E7E3F0;
      --avatar-bg: #E9E6F4;
      --hero-sub: #CDC9E2;
      --log-title: #FAF3EE;
      --log-sub: #E3CDBF;
      --button-ink: #4A3A05;
    }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-outer);
      color: var(--ink);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .phone {
      width: 390px;
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
    }
    .phone { padding-top: env(safe-area-inset-top, 0px); }
    .page { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 16px 20px 22px; overflow-y: auto; scrollbar-width: none; }
    .page::-webkit-scrollbar { display: none; }
    svg { display: block; fill: none; stroke: var(--purple); flex-shrink: 0; }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--purple); outline-offset: 4px; }
    .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; flex-shrink: 0; padding: 4px 0; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .brand span { color: var(--purple); }
    .hero { flex: 1.3 0 210px; min-height: 210px; max-height: 250px; background: var(--purple); border-radius: 20px; padding: 26px 24px; display: flex; gap: 16px; justify-content: space-between; align-items: center; }
    .hero .left { min-width: 0; }
    .hero h1 { font-size: clamp(24px, 3.2dvh, 28px); font-weight: 800; line-height: 1.35; margin-bottom: 10px; color: var(--bg-page); }
    .hero h1 span { color: var(--yellow); }
    .hero p { font-size: 13px; font-weight: 400; color: var(--hero-sub); line-height: 1.5; margin-bottom: 20px; }
    .hero .btn { display: inline-block; background: var(--yellow); color: var(--button-ink); font-size: 15px; font-weight: 700; padding: 12px 20px; border-radius: 24px; }
    .hero .art { flex-shrink: 0; }
    .hero .art svg { width: clamp(108px, 14dvh, 140px); height: clamp(108px, 14dvh, 140px); stroke: var(--yellow); }
    .log { flex: .4 0 92px; min-height: 92px; max-height: 140px; background: var(--brown); border-radius: 20px; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; }
    .log .t { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--log-title); }
    .log .s { font-size: 13px; font-weight: 400; color: var(--log-sub); line-height: 1.5; }
    .log .right { display: flex; align-items: center; gap: 10px; margin-left: 10px; }
    .log .right svg { width: 44px; height: 44px; stroke: var(--yellow); }
    .log .arrow { font-size: 20px; color: var(--yellow); }
    .knowledge { flex: .8 0 218px; min-height: 218px; max-height: 280px; display: flex; flex-direction: column; }
    .sec-t { font-size: 15px; font-weight: 600; flex-shrink: 0; margin: 0 2px 12px; display: flex; justify-content: space-between; align-items: center; }
    .refresh-knowledge { display: grid; place-items: center; width: 44px; height: 44px; margin: -12px -12px -12px 0; flex-shrink: 0; border-radius: 50%; }
    .refresh-knowledge svg { width: 20px; height: 20px; stroke: var(--ink-mute); }
    .refresh-knowledge:hover svg { stroke: var(--purple); }
    .refresh-knowledge:active { background: var(--avatar-bg); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .knows { flex: 1; display: flex; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 8px; scrollbar-color: var(--nav-off-ic) var(--white); scrollbar-width: thin; }
    .knows::-webkit-scrollbar { height: 6px; }
    .knows::-webkit-scrollbar-track { background: var(--white); border-radius: 14px; }
    .knows::-webkit-scrollbar-thumb { background: var(--nav-off-ic); border-radius: 14px; }
    .know { flex: 0 0 148px; min-width: 148px; display: flex; flex-direction: column; justify-content: center; background: var(--white); border-radius: 16px; padding: 18px; }
    .know .ic { display: block; margin-bottom: 14px; }
    .know .ic svg { width: 32px; height: 32px; stroke: var(--pink); }
    .know .t { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
    .know .s { font-size: 13px; font-weight: 400; color: var(--ink-sub); line-height: 1.55; }
    @media (max-width: 359px) {
      .hero { gap: 12px; padding: 22px 18px; }
      .hero h1 { font-size: 24px; }
      .hero .art svg { width: 100px; height: 100px; }
      .log { padding: 18px; }
      .know { flex-basis: 140px; min-width: 140px; padding: 16px; }
      .know .t { font-size: 13px; }
      .know .s { font-size: 12px; }
    }
    .nav { flex-shrink: 0; margin: 0 20px 16px; margin-bottom: max(16px, env(safe-area-inset-bottom)); background: var(--white); border: 1px solid var(--nav-line); border-radius: 26px; display: flex; padding: 12px 0 11px; }
    .nav .tab { flex: 1; text-align: center; font-size: 11px; font-weight: 400; color: var(--nav-off); }
    .nav .tab .ic { display: flex; align-items: center; justify-content: center; width: 38px; height: 26px; margin: 0 auto 4px; border-radius: 13px; }
    .nav .tab .ic svg { width: 22px; height: 22px; stroke: var(--nav-off-ic); }
    .nav .tab.on { color: var(--ink); font-weight: 600; }
    .nav .tab.on .ic { background: var(--yellow); }
    .nav .tab.on .ic svg { stroke: var(--purple); }
  </style>

  <div class="phone">
    <main class="page">

      <header class="top">
        <div class="brand">今天<span>吃什么</span></div>
      </header>

      <a class="hero" href="page2_ask.html" aria-labelledby="hero-title">
        <div class="left">
          <h1 id="hero-title">现在<br>决定<span>吃什么</span></h1>
          <p id="goal-description">当前目标：营养均衡</p>
          <span class="btn">问一问 →</span>
        </div>
        <div class="art" aria-hidden="true"><svg><use href="#i-noodle"/></svg></div>
      </a>

      <a class="log" href="page4_log.html" aria-label="记一顿，拍照、语音或文字记录">

          <div class="t">记一顿</div>
          <div class="s">拍照 / 语音 / 文字，随手记录</div>
        </div>
        <span class="right" aria-hidden="true">
          <svg><use href="#i-camera"/></svg><span class="arrow">→</span>
        </span>
      </a>

      <section class="knowledge" aria-labelledby="knowledge-title">
        <div class="sec-t">
          <h2 id="knowledge-title" style="font:inherit">健康饮食科普</h2>
          <button class="refresh-knowledge" id="refresh-knowledge" type="button" aria-controls="knowledge-cards" aria-label="换一批健康饮食科普" title="换一批">
            <svg aria-hidden="true"><use href="#i-refresh"/></svg>
          </button>
        </div>
        <div class="knows" id="knowledge-cards" tabindex="0" role="region" aria-label="健康饮食科普，可左右滑动">
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-broccoli"/></svg></span>
            <h3 class="t">餐餐添点蔬菜</h3>
            <p class="s">每天至少300克，深色蔬菜约占一半</p>
          </article>
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-apple"/></svg></span>
            <h3 class="t">水果优先鲜吃</h3>
            <p class="s">每天200～350克，果汁不能代替新鲜水果</p>
          </article>
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-grain"/></svg></span>
            <h3 class="t">主食粗细搭配</h3>
            <p class="s">保留谷类主食，经常搭配全谷物和杂豆</p>
          </article>
          <article class="know">
            <span class="ic" aria-hidden="true"><svg><use href="#i-water-cup"/></svg></span>
            <h3 class="t">喝水少量多次</h3>
            <p class="s">优先白水或茶水，不用含糖饮料代替</p>
          </article>
        </div>
        <p class="sr-only" id="knowledge-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
